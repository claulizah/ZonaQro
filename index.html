<title>ZonaQro</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Directorio de negocios, servicios y cupones en Zibatá, Zakia, Juriquilla y El Refugio, Querétaro.">
<link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta property="og:type" content="website">
<meta property="og:site_name" content="ZonaQro">
<meta property="og:title" content="ZonaQro: negocios, eventos y cupones de tu zona">
<meta property="og:description" content="Zibatá, Zakia, Juriquilla y El Refugio. Encuentra negocios de tus vecinos, eventos y cupones.">
<meta property="og:url" content="https://zonaqro.com/">
<meta property="og:image" content="https://zonaqro.com/og.png">
<meta property="og:image:width" content="1200"><meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<style>
/* Layout: barra fija + contenedor de 1080px; portada con buscador, cuadrícula de fichas que baja a una columna en celular. Agave = acción, jacaranda = badges, sol = cupones. */
:root{
  --bg:#F4F7F2; --surface:#FFFFFF; --ink:#17231C; --muted:#56665B; --line:#D9E2D6;
  --agave:#2C674B; --agave-ink:#FFFFFF; --soft-agave:#E2EEE6;
  --jaca:#6A4DB6; --soft-jaca:#ECE7F7;
  --sun:#B97A0C; --soft-sun:#FBF0D6; --sun-line:#E6C27A;
  --wa:#1E8E4E; --danger:#B3402E;
  --ink-soft:#3C4A41; --chip:#EAF0E7; --coral:#9A3F31; --soft-coral:#FBE6E1; --mint:#1F6B58; --soft-mint:#D8F0E5;
  --f-display:"Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --f-body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1612; --surface:#17201B; --ink:#E4ECE6; --muted:#9BAAA0; --line:#2A362F;
  --agave:#6CC596; --agave-ink:#0C1510; --soft-agave:#1C3226;
  --jaca:#AE97EC; --soft-jaca:#28203D;
  --sun:#F0BE55; --soft-sun:#33290F; --sun-line:#6E5418;
  --wa:#4CCB82; --danger:#F08A76; --ink-soft:#C3D0C7; --chip:#202C25; --coral:#F2A596; --soft-coral:#3A2420; --mint:#7BD6B8; --soft-mint:#16342B; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1612; --surface:#17201B; --ink:#E4ECE6; --muted:#9BAAA0; --line:#2A362F;
  --agave:#6CC596; --agave-ink:#0C1510; --soft-agave:#1C3226;
  --jaca:#AE97EC; --soft-jaca:#28203D;
  --sun:#F0BE55; --soft-sun:#33290F; --sun-line:#6E5418;
  --wa:#4CCB82; --danger:#F08A76; --ink-soft:#C3D0C7; --chip:#202C25; --coral:#F2A596; --soft-coral:#3A2420; --mint:#7BD6B8; --soft-mint:#16342B; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--agave);outline-offset:2px;border-radius:6px}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
h1,h2,h3{font-family:var(--f-display);line-height:1.1;text-wrap:balance;margin:0}
h1{font-size:clamp(2rem, 6vw, 3.4rem);font-weight:800;letter-spacing:-.02em}
h2{font-size:clamp(1.4rem, 3.5vw, 1.9rem);font-weight:800;letter-spacing:-.01em}
h3{font-size:1.15rem;font-weight:600}
p{margin:0}
.muted{color:var(--muted)}
.eyebrow{font-size:.75rem;text-transform:uppercase;letter-spacing:.09em;font-weight:700;color:var(--muted)}

/* barra demo + header */
.demo{background:var(--soft-sun);color:var(--ink);font-size:.85rem;border-bottom:1px solid var(--sun-line)}
.demo .wrap{padding-block:8px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top, 0px);z-index:10;background:var(--surface)}
header.top{position:sticky;top:env(safe-area-inset-top, 0px);z-index:9;background:var(--surface);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;gap:16px;padding-block:12px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:2px;text-decoration:none;font-family:var(--f-display);font-weight:800;font-size:1.45rem;letter-spacing:-.02em}
.logo b{color:var(--agave)}
.logo .li{height:1.7em;width:auto;margin-right:6px;flex:none}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .logo .li{filter:brightness(1.9) saturate(.9)}}
:root[data-theme="dark"] .logo .li{filter:brightness(1.9) saturate(.9)}
nav.main{display:flex;gap:4px;flex-wrap:wrap;margin-left:auto}
nav.main a{text-decoration:none;padding:7px 12px;border-radius:999px;font-weight:600;font-size:.92rem;color:var(--muted)}
nav.main a:hover{color:var(--ink);background:var(--soft-agave)}
nav.main a[aria-current="page"]{color:var(--ink);background:var(--soft-agave)}
nav.main a.cta{background:var(--agave);color:var(--agave-ink)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.zsel{position:relative}
.zsel select{width:auto;border-radius:999px;padding:7px 32px 7px 14px;font-weight:700;font-size:.9rem;background-color:var(--soft-agave);border-color:transparent;cursor:pointer}
.tabbar{display:none}
.short{display:none}
@media (max-width:640px){
  header.top .wrap{flex-wrap:nowrap;gap:10px}
  .zsel{margin-left:auto;min-width:0}
  .zsel select{max-width:130px;padding:7px 28px 7px 12px;font-size:.85rem;text-overflow:ellipsis}
  .long{display:none}
  .short{display:inline}
  .logo{font-size:1.3rem}
  nav.main{margin-left:0}
  nav.main a:not(.cta){display:none}
  nav.main a.cta{padding:7px 12px;font-size:.85rem;white-space:nowrap}
  .tabbar{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:9;background:var(--surface);border-top:1px solid var(--line);padding:6px max(8px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px))}
  .tabbar a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border-radius:12px;text-decoration:none;color:var(--muted);font-size:.72rem;font-weight:700}
  .tabbar a svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .tabbar a[aria-current="page"]{color:var(--agave);background:var(--soft-agave)}
  body{padding-bottom:calc(72px + env(safe-area-inset-bottom, 0px))}
  .toast{bottom:calc(84px + env(safe-area-inset-bottom, 0px))}
  .chips.scrollrow{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
  .chips.scrollrow::-webkit-scrollbar{display:none}
  .chips.scrollrow .chip{flex:none;white-space:nowrap}
  .filters .frow{grid-template-columns:1fr 1fr}
  .filters .frow>label:first-child{grid-column:1/-1}
}

main{padding-block:28px 56px;display:flex;flex-direction:column;gap:44px}
section{display:flex;flex-direction:column;gap:16px}
.sec-head{display:flex;align-items:end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.sec-head a{font-weight:600;color:var(--agave);text-decoration:none}
.sec-head a.btn{color:var(--agave-ink)}

/* hero */
.hero{display:grid;grid-template-columns:1.2fr .8fr;gap:28px;align-items:center}
.hero .lead{font-size:1.1rem;color:var(--muted);max-width:52ch;margin-top:12px}
.search{display:flex;gap:8px;margin-top:20px;background:var(--surface);border:1.5px solid var(--line);border-radius:999px;padding:6px 6px 6px 18px}
.search input{flex:1;min-width:0;border:0;background:transparent;outline:none;font-size:1rem}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:999px;padding:10px 18px;font-weight:700;cursor:pointer;text-decoration:none;background:var(--agave);color:var(--agave-ink)}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.wa{background:var(--wa);color:#fff}
.btn.sm{padding:6px 12px;font-size:.88rem}
.btn:hover{filter:brightness(1.06)}
.zones-board{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:10px}
.zone-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;border-radius:10px;text-decoration:none;border:1px solid transparent}
.zone-row:hover{border-color:var(--line);background:var(--bg)}
.zone-row strong{font-family:var(--f-display);font-size:1.15rem}
.zone-row span{font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}
@media (max-width:760px){.hero{grid-template-columns:1fr}}

/* categorías */
.cats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.cat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;text-decoration:none;display:flex;flex-direction:column;gap:2px;cursor:pointer;text-align:left}
.cat:hover{border-color:var(--agave)}
.cat strong{font-weight:700}
.cat span{font-size:.82rem;color:var(--muted)}
@media (max-width:640px){.cats{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* fichas */
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
@media (max-width:900px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:580px){.grid{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 18px 20px;text-decoration:none;display:flex;flex-direction:column;gap:12px;min-width:0}
.card{position:relative}
.card:hover{border-color:var(--agave)}
.card a.stretch{text-decoration:none}
.card a.stretch::after{content:"";position:absolute;inset:0;border-radius:var(--r)}
.card .act{position:relative;z-index:1}
.acts{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
button.badge{border:0;cursor:pointer;font-size:.8rem;padding:6px 12px;border-radius:999px}
button.badge:hover{filter:brightness(.96)}
.zone-row .zinfo{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
dialog{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);color:var(--ink);padding:0;width:min(440px, calc(100vw - 32px));max-height:calc(100vh - 48px);overflow:auto}
dialog::backdrop{background:rgba(10,18,13,.55)}
.dlg-in{padding:18px;display:flex;flex-direction:column;gap:14px}
.dlg-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.banner{background:var(--soft-agave);border-radius:var(--r);padding:16px 18px;display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}
.banner p{max-width:52ch}
.card.promo{border-color:var(--jaca)}
.card-top{display:flex;gap:12px;align-items:center;min-width:0}
[hidden]{display:none!important}
img.avatar{display:block;object-fit:cover;background:var(--chip)}
.b-ver{background:var(--soft-agave);color:var(--agave);display:inline-flex;align-items:center;gap:4px}
.b-ver svg{width:11px;height:11px;fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.b-open{background:var(--soft-mint);color:var(--mint)}
.rate{font-size:.82rem;font-weight:700;color:var(--sun)}
.rate small{color:var(--muted);font-weight:600}
.hgrid{display:flex;flex-direction:column;gap:8px}
.hrow{display:grid;grid-template-columns:62px minmax(0,1fr) auto minmax(0,1fr);gap:6px;align-items:center}
.hrow input[type=time]{padding:8px 6px;font-size:.88rem;min-width:0}
.hrow input:disabled{opacity:.4}
.hsep{color:var(--muted);font-size:.85rem}
.hpre{display:flex;gap:6px;flex-wrap:wrap}
.gal{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.gal img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:12px;display:block}
.gal.uno{grid-template-columns:1fr}.gal.uno img{aspect-ratio:16/9}
.thumbs{display:flex;gap:10px;flex-wrap:wrap}
.thumb{position:relative}
.thumb img{width:92px;height:70px;object-fit:cover;border-radius:10px;display:block}
.thumb button{position:absolute;top:-8px;right:-8px;padding:2px 8px}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.stars{display:inline-flex;flex-direction:row-reverse;justify-content:flex-end;gap:2px;position:relative}
.stars input{position:absolute;opacity:0;width:1px;height:1px}
.stars label{font-size:2rem;line-height:1;color:var(--sun-line);cursor:pointer}
.stars input:checked~label,.stars label:hover,.stars label:hover~label{color:var(--sun)}
.stars input:focus-visible+label{outline:2px solid var(--agave);border-radius:6px}
.rev{border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:6px}
.resp{background:var(--soft-agave);border-radius:12px;padding:10px 12px;font-size:.9rem}
.linkbtn{border:0;background:none;text-decoration:underline;color:var(--muted);cursor:pointer;font:inherit;padding:0}
.rev-form summary{cursor:pointer;list-style:none;display:inline-block}
.rev-form summary::-webkit-details-marker{display:none}
.rev-form form{margin-top:12px;display:flex;flex-direction:column;gap:12px}
.filters .frow.hrs>label:first-child{grid-column:auto}
@media (min-width:641px){.frow.hrs{grid-template-columns:repeat(4,1fr)}}

.avatar{flex:none;width:48px;height:48px;border-radius:12px;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:1.1rem;color:#fff}
.card-top div{min-width:0}
.card-top h3{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta{font-size:.84rem;color:var(--muted)}
.card p.desc{font-size:.93rem;color:var(--ink-soft);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.badges{display:flex;flex-wrap:wrap;gap:6px}
.badge{font-size:.72rem;font-weight:700;padding:3px 9px;border-radius:999px;letter-spacing:.02em}
.b-promo{background:var(--jaca);color:var(--surface)}
.b-fav{background:var(--soft-coral);color:var(--coral);display:inline-flex;align-items:center;gap:5px}
.b-fav svg{width:11px;height:11px;fill:currentColor}
.b-new{background:var(--soft-mint);color:var(--mint)}
.b-cupon{background:var(--soft-sun);color:var(--sun)}
.card-foot{margin-top:auto;display:flex;justify-content:space-between;align-items:center;font-size:.84rem;color:var(--muted);gap:8px}

/* filtros */
.filters{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:14px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1.5px solid var(--line);background:var(--chip);border-radius:999px;padding:6px 12px;font-size:.88rem;font-weight:600;cursor:pointer;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--agave);border-color:var(--agave);color:var(--agave-ink)}
.chip small{font-weight:500;opacity:.8;font-variant-numeric:tabular-nums}
.frow{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}

label.fld{display:flex;flex-direction:column;gap:4px;font-size:.84rem;font-weight:600;color:var(--muted)}
input[type=text],input[type=tel],input[type=search],input[type=date],input[type=time],input[type=url],input[type=password],input[type=email],select,textarea{background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:9px 11px;font-size:.95rem;color:var(--ink);width:100%}
textarea{min-height:90px;resize:vertical}
.count{font-size:.9rem;color:var(--muted)}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:28px;text-align:center;color:var(--muted)}

/* cupones como boleto */
.tickets{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (max-width:640px){.tickets{grid-template-columns:1fr}}
.ticket{display:grid;grid-template-columns:1fr auto;background:var(--soft-sun);border:1.5px solid var(--sun-line);border-radius:var(--r);overflow:hidden;min-width:0}
.ticket .t-main{padding:14px 16px;display:flex;flex-direction:column;gap:6px;min-width:0}
.ticket .t-side{border-left:2px dashed var(--sun-line);padding:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-width:120px}
.ticket .code{font-family:var(--f-mono);font-weight:700;font-size:1.1rem;letter-spacing:.06em;color:var(--sun)}
.ticket .t-biz{font-size:.82rem;font-weight:700;color:var(--muted);text-decoration:none}
.ticket h3{font-size:1.05rem}
.ticket .small{font-size:.8rem;color:var(--muted)}
.qr{background:#fff;padding:6px;border-radius:8px;line-height:0}
.qr svg{width:120px;height:120px}

/* ficha detalle */
.biz-head{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.biz-head .avatar{width:76px;height:76px;font-size:1.7rem;border-radius:18px}
.biz-grid{display:grid;grid-template-columns:1.3fr .7fr;gap:20px;align-items:start}
@media (max-width:820px){.biz-grid{grid-template-columns:1fr}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
dl.info{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;margin:0;font-size:.95rem}
dl.info dt{font-weight:700;color:var(--muted)}
dl.info dd{margin:0;min-width:0}
.phone{font-family:var(--f-mono);font-weight:700;font-size:1.05rem;user-select:all}
.catalog{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:640px){.catalog{grid-template-columns:repeat(2,minmax(0,1fr))}}
.prod{border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px;background:var(--bg);min-width:0}
.prod .swatch{aspect-ratio:4/3;max-width:100%;border-radius:8px;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;color:#fff;font-size:1.2rem}
.prod strong{font-size:.92rem}
.price{font-variant-numeric:tabular-nums;font-weight:700;color:var(--agave)}
.mimx{background:var(--soft-agave);border-radius:var(--r);padding:18px;display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}
.back{font-weight:600;color:var(--agave);text-decoration:none;font-size:.92rem}

/* formulario */
form.reg{display:flex;flex-direction:column;gap:14px;max-width:680px}
fieldset{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:0;display:flex;flex-direction:column;gap:8px}
legend{font-weight:700;font-size:.9rem;padding:0 6px}
.opt{display:flex;gap:10px;align-items:flex-start;font-size:.95rem;cursor:pointer}
.opt input{margin-top:4px}
.opt span small{display:block;color:var(--muted)}
.inline-opts{display:flex;flex-wrap:wrap;gap:6px 18px}
.notice{border-radius:12px;padding:14px 16px;background:var(--soft-agave);font-weight:600}
.notice.err{background:var(--soft-sun);color:var(--ink)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:580px){.two{grid-template-columns:1fr}}

/* admin */
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tbl-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
table{border-collapse:collapse;width:100%;font-size:.92rem}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:.75rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}
.req{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:8px}
.req-actions{display:flex;gap:8px;flex-wrap:wrap}
.btn.danger{background:transparent;color:var(--danger);border:1.5px solid var(--danger)}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:640px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}

async function sb(path, o = {}){
  const ctl = new AbortController(); const to = setTimeout(() => ctl.abort(), o.timeout || 8000);
  try{
    const h = {apikey:SB_KEY, Authorization:"Bearer " + ((o.auth !== false && SB.token) || SB_KEY)};
    if(o.body !== undefined) h["Content-Type"] = "application/json";
    if(o.prefer) h.Prefer = o.prefer;
    const r = await fetch(SB_URL + path, {method:o.method || "GET", headers:h, body:o.body !== undefined ? JSON.stringify(o.body) : undefined, signal:ctl.signal, keepalive:!!o.keepalive});
    const txt = await r.text(); let d = null; try{ d = txt ? JSON.parse(txt) : null; }catch(e){}

  } finally { clearTimeout(to); }
}

const DK = ["lun","mar","mie","jue","vie","sab","dom"];
const DN = {lun:"Lun",mar:"Mar",mie:"Mié",jue:"Jue",vie:"Vie",sab:"Sáb",dom:"Dom"};
const DL = {lun:"Lunes",mar:"Martes",mie:"Miércoles",jue:"Jueves",vie:"Viernes",sab:"Sábado",dom:"Domingo"};
const LV = DK.slice(0,5), LS = DK.slice(0,6);
const hs = (dias, a, c) => Object.fromEntries(dias.map(d => [d, [a, c]]));
const HOR = { // horarios de los negocios de ejemplo
  "tacos-la-cantera": hs(DK.slice(1), "18:00", "00:00"),
  "plomeria-don-chuy": hs(LS, "08:00", "19:00"),
  "vet-huellitas": hs(LS, "09:00", "20:00"),
  "agua-pura-zibata": hs(DK, "08:00", "18:00"),
  "electricista-zakia": hs(LS, "08:00", "18:00"),
  "cafe-mirador": hs(DK, "07:30", "21:00"),
  "tutorias-mate": hs(LV, "16:00", "20:00")
};
const HORAS = Array.from({length:19}, (_, i) => pad2((i + 6) % 24) + ":00"); // 6:00 am a 12:00 am
function pad2(n){ return String(n).padStart(2, "0"); }
const mins = t => { const [h, m] = t.split(":").map(Number); return h * 60 + m; };
function h12(t){ const [H, M] = t.split(":").map(Number); return (H % 12 || 12) + ":" + pad2(M) + " " + (H >= 12 ? "pm" : "am"); }
function horarioTexto(h){
  const g = []; let i = 0;
  while(i < 7){
    const t = h[DK[i]]; if(!t){ i++; continue; }
    let j = i; while(j + 1 < 7 && h[DK[j+1]] && h[DK[j+1]][0] === t[0] && h[DK[j+1]][1] === t[1]) j++;
    const n = j - i + 1, a = DN[DK[i]], z = DN[DK[j]].toLowerCase();
    g.push((n === 7 ? "Todos los días" : n === 1 ? a : n === 2 ? a + " y " + z : a + " a " + z) + ", " + h12(t[0]) + " a " + h12(t[1]));
    i = j + 1;
  }
  return g.join(" · ");
}
function horariosDe(b){
  let h = b.horarios; if(!h || typeof h !== "object" || !Object.keys(h).length) h = HOR[b.id];
  if(!h) return null;
  const out = {};
  for(const d of DK){ const t = h[d]; if(Array.isArray(t) && /^\d\d:\d\d$/.test(t[0]) && /^\d\d:\d\d$/.test(t[1])) out[d] = [t[0], t[1]]; }
  return Object.keys(out).length ? out : null;
}
function horarioDe(b){ const h = horariosDe(b); return h ? horarioTexto(h) : (b.horario || ""); }
function abiertoEn(b, dia, m){ // m en minutos; null = a cualquier hora de ese día
  const h = horariosDe(b); if(!h) return false;
  if(m === null) return !!h[dia];
  const prev = DK[(DK.indexOf(dia) + 6) % 7];
  const t = h[dia]; if(t){ const a = mins(t[0]), c = mins(t[1]); if(c > a ? (m >= a && m < c) : m >= a) return true; }
  const p = h[prev]; if(p){ const a = mins(p[0]), c = mins(p[1]); if(c <= a && m < c) return true; }
  return false;
}
function hoyKey(){ return DK[(new Date().getDay() + 6) % 7]; }
function abiertoAhora(b){ const d = new Date(); return abiertoEn(b, hoyKey(), d.getHours() * 60 + d.getMinutes()); }
function cumpleHorario(b, f){
  if(f.ahora) return abiertoAhora(b);
  return abiertoEn(b, f.dia || hoyKey(), f.hora ? mins(f.hora) : null);
}

function hoyISO(){ const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0"); }
function eventos(){ return (DATA.live ? DATA.eventos : EVENTOS.concat(estado.evAprobados)).filter(e => e.fecha >= hoyISO()).sort((a,b) => a.fecha.localeCompare(b.fecha)); }
function eventoCard(e){

  const txt = "Hola, vi el evento " + e.titulo + " en ZonaQro y quiero más información.";
  return `<article class="evento${e.destacado ? " dest" : ""}">
    <div class="fecha" aria-label="${dia} de ${mes}"><b>${dia}</b><span>${mes}</span></div>
    <div class="ev-body">
      <div class="badges"><span class="badge b-tipo">${TIPOS_EV[e.tipo]}</span>${e.destacado ? '<span class="badge b-promo">Evento destacado</span>' : ""}</div>

function enviarEvento(){
  const v = id => document.getElementById(id).value.trim();
  const err = [];
  if(!v("e-titulo")) err.push("escribe el nombre del evento");
  if(!v("e-lugar")) err.push("indica el lugar");
  if(!v("e-fecha")) err.push("elige la fecha");
  else if(v("e-fecha") < hoyISO()) err.push("la fecha ya pasó");
  if(!v("e-hora")) err.push("indica el horario");
  if(!/^\d{10}$/.test(v("e-wa"))) err.push("el WhatsApp debe tener 10 dígitos");
  let web = v("e-web");
  if(web && !/^https?:\/\//i.test(web)) web = "https://" + web;
  if(web && !/^https?:\/\/[^\s.]+\.[^\s]+$/i.test(web)) err.push("revisa el enlace del evento");
  if(web.length > 200) err.push("el enlace es muy largo");
  if(!document.getElementById("e-ok").checked) err.push("acepta el aviso de privacidad");
  const box = document.getElementById("e-err");
  if(err.length){ box.hidden = false; box.textContent = "Para enviar: " + err.join(", ") + "."; return; }
  const filaEv = ({id:"ev-" + Date.now().toString(36), titulo:v("e-titulo"), tipo:v("e-tipo"), zona:v("e-zona"), lugar:v("e-lugar"), fecha:v("e-fecha"), hora:v("e-hora"), precio:v("e-precio") || "Por confirmar", organizador:v("e-org") || "Vecinos de la zona", whatsapp:v("e-wa"), descripcion:v("e-desc"), fuente:web, mimx:document.getElementById("e-mimx").checked});
  enviar("eventos", filaEv, () => { estado.evSolicitudes.push(filaEv); guardar("zq_ev_solicitudes", estado.evSolicitudes); }, vRegEvento, box);
}

  }
  t.disabled = true;
  try{
    const r = await sb("/rest/v1/" + tabla + "?id=eq." + encodeURIComponent(id), {method:"PATCH", body:cambios, prefer:"return=representation"});
    if(!r || !r.length) throw new Error("el cambio no se aplicó (revisa que entraste como administradora)");
    toast("Listo"); await cargarAdmin(); cargarPublico();
  }catch(err){ toast("No se pudo: " + err.message); t.disabled = false; }
});

function render(){

  let html, nav = h;
  if(h.startsWith("n-")){ html = vNegocio(h.slice(2)); nav = "directorio"; }
  else if(h === "directorio") html = vDirectorio(false);
  else if(h === "vecinos") html = vDirectorio(true);
  else if(h === "cupones") html = vCupones();
  else if(h === "eventos") html = vEventos();
  else if(h === "publicar-evento") html = vRegEvento(false);
  else if(h === "registrar") html = vRegistrar(false);
  else if(h === "admin") html = vAdmin(adminTab);
  else if(h === "privacidad") html = vPrivacidad();
  else { html = vInicio(); nav = "inicio"; }
  app.innerHTML = html;
  if(h === "admin" && SB.ok && SB.token && !estado.admin.cargado && !estado.admin.cargando){ estado.admin.cargando = true; cargarAdmin().finally(() => { estado.admin.cargando = false; }); }
  document.querySelectorAll("nav.main a, nav.tabbar a").forEach(a => { if(a.dataset.nav === nav) a.setAttribute("aria-current","page"); else a.removeAttribute("aria-current"); });
  pintarZona();
  try{ document.querySelectorAll('.chips.scrollrow .chip[aria-pressed="true"]').forEach(c => c.scrollIntoView({block:"nearest", inline:"center"})); }catch(err){}
  if(h === "registrar" || (h === "admin" && document.getElementById("fReg"))) prepararRegistro();
  else if(FOTOS.length){ FOTOS.forEach(f => URL.revokeObjectURL(f.url)); FOTOS = []; }
}

  if(e.target.closest("[data-fahora]")){ estado.f.ahora = !estado.f.ahora; if(estado.f.ahora){ estado.f.dia = ""; estado.f.hora = ""; } render(); return; }
  const r = e.target.closest("[data-reportar]");
  if(r){ r.disabled = true; r.textContent = "Reportada"; if(SB.ok && DATA.live) sb("/rest/v1/rpc/reportar_resena", {method:"POST", body:{rid:r.dataset.reportar}, auth:false}).catch(() => {}); toast("Gracias, la revisamos"); }
});
document.addEventListener("submit", async e => {
  if(e.target.id !== "fRes") return;
  e.preventDefault();
  const f = e.target, g = n => f.elements[n], box = f.querySelector("[data-err]"), btn = f.querySelector("button[type=submit]");
  const nombre = (g("nombre").value.trim().split(/\s+/)[0] || "").slice(0, 40);
  const est = +((f.querySelector('input[name="est"]:checked') || {}).value) || 0;
  const texto = g("texto").value.trim(), wa = g("wa").value.trim(), err = [];
  if(nombre.length < 2) err.push("escribe tu nombre");
  if(!est) err.push("elige las estrellas");
  if(texto.length < 10) err.push("cuéntanos un poco más (mínimo 10 letras)");
  if(!/^\d{10}$/.test(wa)) err.push("tu WhatsApp debe tener 10 dígitos");
  if(!g("ok").checked) err.push("confirma que fuiste cliente y acepta el aviso de privacidad");
  if(err.length){ box.hidden = false; box.textContent = "Para enviar: " + err.join(", ") + "."; return; }
  const listo = () => { f.innerHTML = '<div class="notice">Gracias, ya recibimos tu opinión. La publicamos en cuanto confirmemos que fuiste cliente.</div>'; };
  if(g("web").value || !(SB.ok && DATA.live)){ listo(); return; }
  btn.disabled = true; box.hidden = true;
  try{
    await sb("/rest/v1/resenas", {method:"POST", auth:false, prefer:"return=minimal", body:{negocio_id:f.dataset.nid, nombre:nombre.charAt(0).toUpperCase() + nombre.slice(1), estrellas:est, texto, contacto:wa}});
    listo();
  }catch(er){
    box.hidden = false; btn.disabled = false;
    box.textContent = /duplicate|unique|23505/i.test(er.message) ? "Ya recibimos una opinión de este número para este negocio." : "No pudimos enviar tu opinión. Intenta de nuevo.";
  }
});

function tipoSel(){ const r = document.querySelector('input[name="tipo"]:checked'); return r ? r.value : "local"; }
function mostrarCamposTipo(){
  const t = tipoSel();
  document.getElementById("campos-local").hidden = t !== "local";
  document.getElementById("campos-hor").hidden = t === "emprendimiento";
  document.getElementById("campos-emp").hidden = t !== "emprendimiento";
  document.getElementById("lg-zonas").textContent = t === "local" ? "Zona donde está tu local" : "Zonas que atiendes";
  document.getElementById("lg-hor").textContent = t === "local" ? "Días y horario del local" : "Días y horario de servicio";
}
function sincHorarios(){ for(const d of DK){ const on = document.getElementById("h-" + d + "-on").checked; document.getElementById("h-" + d + "-a").disabled = !on; document.getElementById("h-" + d + "-c").disabled = !on; } }
function mostrarWeb(){
  if(!document.getElementById("w-sitio")) return;
  const w = (document.querySelector('input[name="web"]:checked') || {}).value || "";
  document.getElementById("w-sitio").hidden = w !== "si";
  document.getElementById("w-mimx").hidden = !(w === "no" || w === "redes");
}
function leerHorarios(){
  const h = {}; let err = "";
  for(const d of DK){
    if(!document.getElementById("h-" + d + "-on").checked) continue;
    const a = document.getElementById("h-" + d + "-a").value, c = document.getElementById("h-" + d + "-c").value;
    if(!a || !c || a === c){ err = "revisa la hora de apertura y cierre del " + DL[d].toLowerCase(); continue; }
    h[d] = [a, c];
  }
  return {h, err};
}
let FOTOS = [];
function pintarFotos(){
  const box = document.getElementById("fotos-prev"); if(!box) return;
  box.innerHTML = FOTOS.map((f, i) => `<div class="thumb"><img src="${f.url}" alt="Foto ${i + 1}"><button type="button" class="btn sm ghost" data-fquitar="${i}" aria-label="Quitar foto ${i + 1}">×</button></div>`).join("");
  const add = document.getElementById("r-fotos"); if(add) add.disabled = FOTOS.length >= 3;
}
async function comprimir(file){
  const url = URL.createObjectURL(file);
  try{
    const img = await new Promise((ok, ko) => { const i = new Image(); i.onload = () => ok(i); i.onerror = () => ko(new Error("img")); i.src = url; });
    for(const [max, q] of [[1000,.78],[1000,.62],[800,.55],[640,.5]]){
      const k = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement("canvas"); c.width = Math.max(1, Math.round(img.width * k)); c.height = Math.max(1, Math.round(img.height * k));
      const x = c.getContext("2d"); x.fillStyle = "#fff"; x.fillRect(0, 0, c.width, c.height); x.drawImage(img, 0, 0, c.width, c.height);
      const blob = await new Promise(ok => c.toBlob(ok, "image/jpeg", q));
      if(blob && blob.size <= 580000) return blob;
    }
    throw new Error("grande");
  } finally { URL.revokeObjectURL(url); }
}
async function subirFotos(id){
  const urls = [];
  for(let i = 0; i < FOTOS.length; i++){
    const path = id + "/" + (i + 1) + "-" + Math.random().toString(36).slice(2, 8) + ".jpg";
    const r = await fetch(SB_URL + "/storage/v1/object/fotos/" + path, {method:"POST", headers:{apikey:SB_KEY, Authorization:"Bearer " + SB_KEY, "Content-Type":"image/jpeg"}, body:FOTOS[i].blob});
    if(!r.ok) throw new Error("foto");
    urls.push(FOTO_BASE + path);
  }
  return urls;
}
function prepararRegistro(){
  mostrarCamposTipo(); sincHorarios(); mostrarWeb();
  const cf = document.getElementById("campos-fotos"); if(cf) cf.hidden = !SB.ok;
  pintarFotos();
}
async function enviarRegistro(){
  const v = id => document.getElementById(id).value.trim();
  const tipo = tipoSel();
  const zonas = [...document.querySelectorAll('input[name="zonas"]:checked')].map(i => i.value);
  const errores = [];
  if(!v("r-nombre")) errores.push("escribe el nombre del negocio");
  if(!/^\d{10}$/.test(v("r-wa"))) errores.push("el WhatsApp debe tener 10 dígitos");
  if(!zonas.length) errores.push("elige al menos una zona");
  if(tipo === "local" && zonas.length > 1) errores.push("un local físico va en una sola zona");
  if(tipo === "local" && !v("r-dir")) errores.push("escribe la dirección del local");
  if(tipo === "emprendimiento" && !v("r-ent")) errores.push("cuéntanos cómo entregas");
  let horarios = {};
  if(tipo !== "emprendimiento"){
    const r = leerHorarios(); horarios = r.h;
    if(r.err) errores.push(r.err);
    else if(tipo === "local" && !Object.keys(horarios).length) errores.push("marca los días que abres");
  }
  const adm = !!document.getElementById("fReg").dataset.admin;
  const web = (document.querySelector('input[name="web"]:checked') || {}).value || "";
  let sitio = "";
  if(web === "si" && v("r-sitio")){
    sitio = v("r-sitio"); if(!/^https?:\/\//i.test(sitio)) sitio = "https://" + sitio;
    try{ const u = new URL(sitio); if(!u.hostname.includes(".")) throw 0; sitio = u.href; if(sitio.length > 160) throw 0; }catch(e){ errores.push("revisa la dirección de tu página web"); }
  }
  const mail = adm ? "" : v("r-mail");
  if(mail && !/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(mail)) errores.push("revisa el correo");
  if(!adm && !document.getElementById("r-ok").checked) errores.push("acepta el aviso de privacidad");
  const box = document.getElementById("r-err");
  if(errores.length){ box.hidden = false; box.textContent = "Para enviar: " + errores.join(", ") + "."; box.scrollIntoView({block:"nearest"}); return; }
  box.hidden = true;
  const nombre = v("r-nombre");
  const id = nombre.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"") + "-" + Date.now().toString(36);
  let fotos = [];
  if(SB.ok && FOTOS.length){
    const btn = document.querySelector("form.reg button[type=submit]"); btn.disabled = true; btn.textContent = "Subiendo fotos…";
    try{ fotos = await subirFotos(id); }
    catch(e){ btn.disabled = false; btn.textContent = "Enviar solicitud"; box.hidden = false; box.textContent = "No pudimos subir las fotos. Intenta otra vez o quítalas y envía sin fotos."; return; }
  }
  const fila = {id, nombre, categoria:v("r-cat"), tipo, zonas, whatsapp:v("r-wa"), descripcion:v("r-desc"),
    direccion: tipo === "local" ? v("r-dir") : "", horario: Object.keys(horarios).length ? horarioTexto(horarios) : "", horarios,
    entrega: tipo === "emprendimiento" ? v("r-ent") : "", redes: tipo === "emprendimiento" ? v("r-redes") : "",
    fotos, tiene_web:web, sitio_web:sitio, interes_mimx:!adm && (web === "no" || web === "redes") && document.getElementById("r-mimx").checked, email:mail};
  if(adm){
    const btn = document.querySelector("form.reg button[type=submit]"); btn.disabled = true;
    sb("/rest/v1/negocios", {method:"POST", body:Object.assign({}, fila, {estado:"aprobado", origen:"zonaqro", verificado:false, alta:hoyISO()}), prefer:"return=minimal"})
      .then(() => { toast("Publicado: " + nombre); estado.admin.cargado = false; adminTab = "publicados"; render(); cargarPublico(); })
      .catch(err => { btn.disabled = false; box.hidden = false; box.textContent = "No se pudo publicar: " + err.message; });
    return;
  }
  enviar("negocios", fila, () => { estado.solicitudes.push(fila); guardar("zq_solicitudes", estado.solicitudes); }, ok => { if(ok) FOTOS = []; return vRegistrar(ok); }, box);
}

if(!ZONAS.includes(estado.f.zona)) estado.f.zona = "";
render();
cargarPublico();
</script>
