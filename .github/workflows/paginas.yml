name: Actualizar páginas para Google
on:
  schedule:
    - cron: "17 11 * * *"   # todos los días (hora UTC)
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  generar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/generar-paginas.js
      - name: Guardar cambios
        run: |
          git config user.name "ZonaQro bot"
          git config user.email "noreply@github.com"
          git add -A n sitemap.xml robots.txt
          if ! git diff --cached --quiet; then git commit -m "Actualizar páginas y sitemap"; git push; fi
